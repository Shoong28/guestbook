# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-02

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crose02.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_9E91A969F19F44758B442038F1314A82 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_0F8075DD953644459DF3EF2E82C167FC }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crose02.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_9E91A969F19F44758B442038F1314A82 }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-02'
          slot-name: 'staging'
          images: 'crose02.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_9E91A969F19F44758B442038F1314A82 }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_268144BF306D473EB553C801BBD25511 }}